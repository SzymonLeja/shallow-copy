[package]
name = "sc-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Crypto primitives for shallow-copy: Argon2id KDF + XChaCha20-Poly1305 AEAD"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
