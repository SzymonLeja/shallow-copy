[package]
name = "sc-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "SQLite operational catalog for shallow-copy — rebuildable from OIAF"

[dependencies]
oiaf = { path = "../oiaf" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
