[package]
name = "sc-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Archive Only ingestion gateway"

[dependencies]
oiaf = { path = "../oiaf" }
sc-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
