[package]
name = "sc-connector-browser-chromium"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Chromium browser history connector for shallow-copy"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sc-ingest = { path = "../../crates/ingest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
