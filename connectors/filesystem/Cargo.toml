[package]
name = "sc-connector-filesystem"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Filesystem ingestion connector for shallow-copy"

[dependencies]
sc-ingest = { path = "../../crates/ingest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
